name: Publish release

# Adding apk/MKBoard-<version>.apk (plus optional release-notes/<version>.md) to main publishes it as
# release v<version>; pushing a v* tag does the same. Already-published versions are skipped.
on:
  push:
    branches: [main]
    paths: ['apk/**', 'release-notes/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish every APK that has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for APK in $(ls apk/MKBoard-*.apk | sort -V); do
            VERSION=$(basename "$APK" .apk); VERSION="${VERSION#MKBoard-}"
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already published"; continue
            fi
            NOTES="release-notes/$VERSION.md"
            [ -f "$NOTES" ] || { echo "MK Board $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
            # newest version becomes "latest" automatically (created last)
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "MK Board $VERSION" --notes-file "$NOTES"
            echo "Published $TAG"
          done
